# App values embedded into the APK at build time.
app_name=Blazz Apps
app_icon=src/assets/icon.png
notification_sound=src/sfx/brightline.mp3
notification_sound_success=src/sfx/success-sound.mp3
notification_sound_error=src/sfx/error-sound.mp3
download_folder=BlazzMedia
apk_file_name=blazz-grabber.apk
notification_silent_channel_id=blazzgrabber_status
# Change this ID whenever any notification sound changes; Android keeps channel sound settings.
notification_sound_channel_id=blazzgrabber_alerts_v3
# Unduhan hanya menerima HTTPS kecuali allow_http=true.
allow_http=false
# Daftar host yang boleh diunduh, dipisah koma. Kosong berarti semua host diizinkan.
# Biarkan kosong untuk pemakaian universal (tanpa batasan host).
allowed_hosts=